# Proves the shared Kotlin compiles and links for iOS.
#
# This existed because the Swift sources and the Gradle iOS targets sat unbuilt
# for weeks: development moved to a Windows machine, and Kotlin/Native's Apple
# targets need the Xcode toolchain. A macOS runner settles it without a Mac.
#
# It is green: ComposeApp.framework links for iosSimulatorArm64, purchases-kmp
# included (it lives in mobileMain, which iOS compiles). What remains for iOS is
# Xcode project packaging, not Kotlin.
#
# macOS runners bill at 10x minutes on private repos and this job takes ~12
# minutes, so it does NOT run on every push — only on demand, or when something
# that could plausibly break the iOS build changes.
name: iOS build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'composeApp/src/commonMain/**'
      - 'composeApp/src/iosMain/**'
      - 'composeApp/src/mobileMain/**'
      - 'composeApp/build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/ios.yml'

jobs:
  framework:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # local.properties is git-ignored and carries the Android SDK path plus
      # client keys. The iOS framework needs neither, but the Android target is
      # configured in the same module, so sdk.dir has to resolve for the build
      # to configure at all.
      - name: Point at the runner's Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Compile shared Kotlin for iOS
        run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64 --no-daemon

      - name: Link the ComposeApp framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --no-daemon

      - name: Show what was produced
        run: |
          find composeApp/build/bin -name "*.framework" -maxdepth 4 -print
          ls -la composeApp/build/bin/iosSimulatorArm64/debugFramework/
