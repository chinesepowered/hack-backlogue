# 4096M + a 3072M Kotlin daemon asked for over 7GB, which does not fit on a
# 16GB machine with an IDE and a browser open — builds were being killed by
# the OS for memory pressure. 2048/1536 builds this project comfortably;
# raise them again on a machine with headroom.
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx1536M
